<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección de Emociones</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <main class="container">

        <!-- PANTALLA 1 -->
        <div id="pantalla-1" class="pantalla activa">
            <div class="card">
                <h1>Detección de Emociones</h1>
                <button id="btn-inicio" class="btn-primary">Inicio</button>
            </div>
        </div>

        <!-- PANTALLA 2 -->
        <div id="pantalla-2" class="pantalla">
            <div class="card card-amplia">
                <h2>Listo para iniciar tu prueba</h2>
                
                <div id="contenedor-camara" class="test-layout oculto">
                    <div class="video-box">
                        <img id="stream-video" src="" alt="Cámara Web">
                    </div>

                    <div id="panel-vivo" class="panel-vivo">
                        <span id="emoji-vivo" class="emoji-mediano">😐</span>
                        <p id="emocion-viva" class="emocion-viva-texto">Sin rostro</p>
                        <p class="timer-text">Tiempo restante: <span id="contador-tiempo">10</span>s</p>
                    </div>
                </div>

                <div class="acciones">
                    <button id="btn-volver-p2" class="btn-secondary">Volver</button>
                    <button id="btn-iniciar-prueba" class="btn-primary">Iniciar Prueba</button>
                </div>
            </div>
        </div>

        <!-- PANTALLA 3 -->
        <div id="pantalla-3" class="pantalla">
            <div class="card">
                <h2>Tus resultados están listos</h2>
                <div class="acciones">
                    <button id="btn-volver-p3" class="btn-secondary">Volver</button>
                    <button id="btn-ver-resultados" class="btn-primary">Ver resultados</button>
                </div>
            </div>
        </div>

        <!-- PANTALLA 4 -->
        <div id="pantalla-4" class="pantalla">
            <div class="card">
                <h2>Éstos son tus resultados</h2>
                
                <div class="resultado-box">
                    <span id="emoji-resultado" class="emoji-grande">😐</span>
                    <h3 id="emocion-predominante">Felicidad</h3>
                </div>

                <button id="btn-terminar" class="btn-primary">Terminar</button>
            </div>
        </div>

    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
